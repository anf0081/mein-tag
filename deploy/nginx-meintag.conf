# Nur falls auf dem Server schon nginx läuft (statt Caddy).
# Zertifikat danach mit: sudo certbot --nginx -d meintag.DEINE-DOMAIN.de
server {
    listen 80;
    listen [::]:80;
    server_name meintag.DEINE-DOMAIN.de;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }
}
